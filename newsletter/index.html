<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newsletter | Adam Banerjee</title>
  <meta name="description" content="Sign up for Adam Banerjee's newsletter for upcoming shows and happenings." />
  <link rel="canonical" href="https://www.adambanerjee.com/newsletter" />
  <link rel="icon" type="image/png" href="/Favicon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link href="https://cdn-images.mailchimp.com/embedcode/classic-061523.css" rel="stylesheet" type="text/css" />
  <style>
    body.newsletter-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body.newsletter-page main.page {
      flex: 1 0 auto;
      position: relative;
      padding-bottom: 0;
      overflow: visible;
    }

    body.newsletter-page .site-footer {
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }

    .newsletter-page .newsletter-wrap {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .newsletter-page .newsletter-layout {
      display: grid;
      grid-template-columns: minmax(0, 52%) minmax(260px, 48%);
      align-items: start;
      gap: 1.15rem;
      min-height: 100%;
    }

    .newsletter-page .newsletter-content {
      min-width: 0;
      text-align: left;
      padding-bottom: 1.8rem;
    }

    .newsletter-page .newsletter-intro {
      margin: 0 0 2rem;
      max-width: 560px;
    }

    .newsletter-page .newsletter-intro p {
      margin-top: 0.75rem;
    }

    .newsletter-page .newsletter-form-wrap {
      margin: 2rem 0 0;
      max-width: 600px;
      text-align: left;
    }

    .newsletter-page .newsletter-photo {
      position: absolute;
      right: -11.5rem;
      bottom: -18.5rem;
      width: min(60vw, 720px);
      min-width: 0;
      display: flex;
      justify-content: flex-end;
      align-items: flex-end;
      overflow: visible;
      pointer-events: none;
      z-index: 0;
    }

    .newsletter-page .newsletter-photo img {
      width: min(174%, 1160px);
      max-width: 1160px;
      height: auto;
      display: block;
      transform: translateX(7rem);
    }

    .newsletter-page #mc_embed_signup {
      background: #fff;
      clear: left;
      color: #111;
      font: 14px Helvetica, Arial, sans-serif;
      width: 100%;
      max-width: 600px;
      margin: 0;
      border-radius: 8px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .newsletter-page #mc_embed_signup_scroll {
      padding: 1.25rem 1.5rem 1.5rem;
    }

    .newsletter-page #mc_embed_signup form {
      margin: 0;
      color: #111;
    }

    .newsletter-page #mc_embed_signup h2,
    .newsletter-page #mc_embed_signup label,
    .newsletter-page #mc_embed_signup .indicates-required,
    .newsletter-page #mc_embed_signup .asterisk,
    .newsletter-page #mc_embed_signup .mc-field-group,
    .newsletter-page #mc_embed_signup .response {
      color: #111;
    }

    .newsletter-page #mc_embed_signup h2 {
      margin-top: 0;
      text-align: left;
    }

    .newsletter-page #mc_embed_signup input[type="text"],
    .newsletter-page #mc_embed_signup input[type="email"] {
      color: #111;
      background: #fff;
      border-color: #999;
    }

    .newsletter-page #mc_embed_signup input[type="text"]::placeholder,
    .newsletter-page #mc_embed_signup input[type="email"]::placeholder {
      color: #555;
    }

    .newsletter-page #mc_embed_signup .button {
      width: auto;
    }

    .newsletter-page .refferal_badge {
      max-width: 100%;
    }

    @media (max-width: 760px) {
      body.newsletter-page main.page {
        padding-bottom: 1.8rem;
      }

      .newsletter-page .newsletter-layout {
        grid-template-columns: 1fr;
        gap: 2rem;
      }

      .newsletter-page .newsletter-content {
        text-align: left;
        padding-bottom: 0;
      }

      .newsletter-page .newsletter-form-wrap,
      .newsletter-page #mc_embed_signup {
        max-width: 100%;
      }

      .newsletter-page #mc_embed_signup_scroll {
        padding: 1.1rem 1.25rem 1.35rem;
      }

      .newsletter-page .newsletter-photo {
        position: static;
        width: 100%;
        justify-content: center;
        margin-bottom: 0;
      }

      .newsletter-page .newsletter-photo img {
        width: min(92%, 420px);
        max-width: 420px;
        transform: none;
      }
    }
  </style>
</head>

        </section>
      </div>

      <div class="newsletter-photo" aria-hidden="true">
        <img src="/Copy of HS Transparent.svg" alt="" />
